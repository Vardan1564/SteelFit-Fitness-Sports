{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - SteelFit</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body>

  {% if messages %}
        <div style="position:fixed;top:calc(var(--nav-h) + 16px);right:24px;z-index:999;display:flex;flex-direction:column;gap:10px;">
          {% for message in messages %}
            <div style="padding:14px 22px;border-radius:12px;background:rgba(13,31,45,0.95);backdrop-filter:blur(16px);border:1px solid {% if message.tags == 'success' %}
                rgba(76,175,132,0.4)
              {% elif message.tags == 'error' %}
                rgba(224,82,82,0.4)
              {% else %}
                rgba(69,104,130,0.4)
              {% endif %};color:#F4EDE8;font-size:14px;font-family:'Poppins',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.4);">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
<div class="auth-page">

  <!-- LEFT PANEL (unchanged) -->
  <div class="auth-page__panel">
    <div class="auth-page__panel-bg"></div>
    <a href="/" class="auth-page__panel-logo">Steel<span>Fit</span></a>

    <p class="auth-page__panel-text">
      FORGE<br><span>YOUR</span><br>LEGEND
    </p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="auth-page__form-side">

    <div class="auth-form">
      <h1 class="auth-form__title">Welcome<br>Back</h1>

      <p class="auth-form__subtitle">
        New to SteelFit?
        <a href="{% url 'register' %}">Create an account →</a>
      </p>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <input type="text" name="username" placeholder="username" required />
          <label>Username</label>
        </div>

        <div class="form-group">
          <input type="password" name="password" placeholder="password" required />
          <label>Password</label>
        </div>

        <button type="submit" class="btn btn--primary btn--full btn--lg">
          Login <span>→</span>
        </button>
      </form>

    </div>

  </div>
</div>
</body>
</html>

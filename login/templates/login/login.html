{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - SteelFit</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>

<body>
<div class="auth-page">

  <!-- LEFT PANEL (unchanged) -->
  <div class="auth-page__panel">
    <div class="auth-page__panel-bg"></div>
    <a href="/" class="auth-page__panel-logo">Steel<span>Fit</span></a>

    <p class="auth-page__panel-text">
      FORGE<br><span>YOUR</span><br>LEGEND
    </p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="auth-page__form-side">

    <div class="auth-form">
      <h1 class="auth-form__title">Welcome<br>Back</h1>

      <p class="auth-form__subtitle">
        New to SteelFit?
        <a href="{% url 'register' %}">Create an account →</a>
      </p>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <input type="text" name="username" placeholder="username" required />
          <label>Username</label>
        </div>

        <div class="form-group">
          <input type="password" name="password" placeholder="password" required />
          <label>Password</label>
        </div>

        <button type="submit" class="btn btn--primary btn--full btn--lg">
          Login <span>→</span>
        </button>
      </form>

    </div>

  </div>
</div>
</body>
</html>
